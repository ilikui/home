# .github/workflows/douban.yml
name: douban

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/douban.yml"
      - "scripts/merge_douban_data.py"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  douban:
    name: Sync all Douban collection statuses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directories and back up current public data
        run: |
          mkdir -p .tmp/douban-sync/mark .tmp/douban-sync/doing .tmp/douban-sync/done static/data/douban
          today="$(date +%Y-%m-%d)"
          for type in book movie music; do
            if [ -f "static/data/${type}.json" ]; then
              cp "static/data/${type}.json" "static/data/douban/${type}_${today}.json.bak"
            fi
          done

      - name: Sync books to-read (mark)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: book
          status: mark
          format: json
          dir: ./.tmp/douban-sync/mark

      - name: Sync books reading (doing)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: book
          status: doing
          format: json
          dir: ./.tmp/douban-sync/doing

      - name: Sync books finished (done)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: book
          status: done
          format: json
          dir: ./.tmp/douban-sync/done

      - name: Sync movies want to watch (mark)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: movie
          status: mark
          format: json
          dir: ./.tmp/douban-sync/mark

      - name: Sync movies watching (doing)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: movie
          status: doing
          format: json
          dir: ./.tmp/douban-sync/doing

      - name: Sync movies watched (done)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: movie
          status: done
          format: json
          dir: ./.tmp/douban-sync/done

      - name: Sync music want to listen (mark)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: music
          status: mark
          format: json
          dir: ./.tmp/douban-sync/mark

      - name: Sync music listening (doing)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: music
          status: doing
          format: json
          dir: ./.tmp/douban-sync/doing

      - name: Sync music listened (done)
        uses: lizheming/doumark-action@master
        with:
          id: olikuio
          type: music
          status: done
          format: json
          dir: ./.tmp/douban-sync/done

      - name: Merge status exports into public JSON
        run: python3 scripts/merge_douban_data.py

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: sync all Douban statuses"
          add: "./static/data"
