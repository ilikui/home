<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="每日 GitHub 热门开源仓库精选，支持按技术领域、编程语言和关键词筛选。">
<meta name="theme-color" content="#0b1020"><title>GitHub Trending · LiKui</title>
<style>
:root{--bg:#0b1020;--panel:#111a2e;--line:#25324b;--text:#eef3ff;--muted:#9baac4;--accent:#a8b4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#18264a 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}.wrap{width:min(1160px,calc(100% - 36px));margin:auto}
header{padding:28px 0 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.04em}.back{color:var(--muted);border:1px solid var(--line);padding:8px 13px;border-radius:999px}
.hero{padding:52px 0 28px}.eyebrow{color:#a8b4ff;font-size:.78rem;letter-spacing:.16em;font-weight:700}h1{font-size:clamp(2.3rem,6vw,4.3rem);line-height:1.05;letter-spacing:-.055em;margin:14px 0}.lead{color:var(--muted);max-width:720px;font-size:1.02rem}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.stat{padding:8px 12px;background:#151f37;border:1px solid var(--line);border-radius:12px;color:#dbe4ff;font-size:.85rem}
.filters{padding:18px;background:rgba(17,26,46,.88);border:1px solid var(--line);border-radius:18px;margin:12px 0 18px;position:sticky;top:10px;z-index:5;backdrop-filter:blur(14px)}
.filter-label{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.08em;margin:0 0 9px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #34415e;background:#151f37;color:#c7d2e8;border-radius:999px;padding:7px 12px;font:inherit;font-size:.84rem;cursor:pointer}.chip:hover{border-color:#8290e8}.chip.active{background:#dce3ff;color:#141a31;border-color:#dce3ff;font-weight:750}
.tools{display:grid;grid-template-columns:minmax(220px,1fr) 220px;gap:10px;margin-top:15px}.tools input,.tools select{width:100%;background:#0b1224;border:1px solid #34415e;color:var(--text);border-radius:11px;padding:12px 14px;font:inherit;outline:none}.tools input:focus,.tools select:focus{border-color:#8290e8}.result-line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:4px 0 58px}.repo-card{min-width:0;padding:19px;background:linear-gradient(145deg,#151f35,#101729);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}.repo-card:hover{transform:translateY(-3px);border-color:#6475c9}
.repo-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.78rem}.rank{color:#aeb9ff;font-weight:800}.language{padding:3px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}.repo-title-row{display:flex;align-items:center;gap:10px;margin-top:17px;min-width:0}.repo-title-row img{width:30px;height:30px;border-radius:50%;background:#26334e}.repo-title-row h2{font-size:1rem;overflow-wrap:anywhere;margin:0}
.description{color:var(--muted);font-size:.91rem;min-height:4.4em;margin:12px 0}.topics{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}.topic{font-size:.72rem;color:#c4ceff;background:#222d4d;border-radius:6px;padding:3px 7px}.categories{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.category-tag{font-size:.7rem;color:#aee7d3;background:#15362f;border:1px solid #245348;border-radius:6px;padding:2px 6px}.metrics{display:flex;flex-wrap:wrap;gap:12px;margin-top:auto;padding-top:18px;color:#c7d2e8;font-size:.8rem}.empty{grid-column:1/-1;padding:48px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:22px 0 34px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr}header{align-items:flex-start}.hero{padding-top:38px}.filters{position:static}}
</style></head>
<body><div class="wrap">
<header><a class="brand" href="/">LiKui / OPEN SOURCE RADAR</a><a class="back" href="/">← 返回主页</a></header>
<section class="hero"><div class="eyebrow">DAILY OPEN-SOURCE DISCOVERY</div><h1>GitHub Trending<span style="color:#8b9cff">.</span></h1>
<p class="lead">每日发现值得关注的开源项目。按技术领域、编程语言或关键词筛选，快速找到 AI、嵌入式、Web、工具链等方向的优质开源项目。</p>
<div class="stats"><span class="stat" id="totalStat">正在加载仓库…</span><span class="stat" id="updatedStat">每日自动更新</span><span class="stat">数据来源：GitHub Search API</span></div></section>
<section class="filters" aria-label="仓库筛选">
<p class="filter-label">按技术领域筛选</p><div class="chips" id="categoryFilters"><button class="chip active" data-category="全部">全部领域</button></div>
<div class="tools"><input id="searchInput" type="search" placeholder="搜索仓库名、描述或 Topic…" aria-label="搜索仓库"><select id="languageFilter" aria-label="按编程语言筛选"><option value="全部">全部语言</option></select></div>
</section>
<div class="result-line"><span id="resultCount">准备展示仓库</span><span>可同时使用领域、语言和关键词筛选</span></div>
<main class="grid" id="repoGrid"><div class="empty">正在加载每日热门仓库数据…</div></main>
<footer><span>LiKui Personal Hub · Build, Learn, Share.</span><span>自动更新 · GitHub Actions</span></footer>
</div>
<script>
const categoryRules = [
  ["AI / LLM", "人工智能 / 大语言模型", /\b(ai|llm|machine learning|deep learning|neural|inference|transformer|openai|人工智能|大模型)\b/i],
  ["AI Agents", "AI Agent / 智能体", /\b(agent|agents|agentic|claude|codex|mcp|智能体)\b/i],
  ["Machine Learning", "机器学习 / 深度学习", /\b(machine learning|deep learning|pytorch|tensorflow|keras|scikit-learn|机器学习|深度学习)\b/i],
  ["Python", "Python", /\b(python|django|flask|fastapi|pandas|numpy)\b/i],
  ["C / C++", "C / C++ / 底层开发", /\b(c\+\+|cpp|embedded c|cmake|gcc|clang|c language)\b/i],
  ["Java / Kotlin", "Java / Kotlin", /\b(java|kotlin|spring boot|jvm|gradle)\b/i],
  ["JavaScript / TypeScript", "JavaScript / TypeScript", /\b(javascript|typescript|nodejs|node\.js|deno|bun)\b/i],
  ["Frontend / Web", "前端 / Web", /\b(frontend|front-end|react|vue|svelte|nextjs|next\.js|css|html|tailwind|browser|website|前端|网页)\b/i],
  ["Backend / API", "后端 / API / 微服务", /\b(backend|back-end|api|server|microservice|graphql|grpc|php|django|flask|fastapi|spring|后端)\b/i],
  ["Go", "Go / Golang", /\b(golang|go language)\b/i],
  ["Rust", "Rust", /\b(rust|cargo|wasm)\b/i],
  ["PHP", "PHP", /\b(php|laravel|symfony|wordpress)\b/i],
  ["Mobile Apps", "移动应用 / Android / iOS", /\b(android|ios|flutter|react-native|swiftui|mobile app|移动应用)\b/i],
  ["Embedded / IoT", "嵌入式 / IoT / RTOS", /\b(embedded|firmware|iot|rtos|esp32|stm32|zephyr|mcu|driver|嵌入式|物联网)\b/i],
  ["AUTOSAR / Automotive", "AUTOSAR / 汽车电子", /\b(autosar|automotive|canbus|can-bus|ecu|uds|vehicle|车载|汽车电子)\b/i],
  ["Autonomous Driving", "自动驾驶 / 感知规划", /\b(autonomous-driving|self-driving|autonomous-vehicles|autonomous driving|adas|自动驾驶)\b/i],
  ["Robotics", "机器人 / ROS", /\b(robotics|robot|ros2?|slam|manipulation|机器人)\b/i],
  ["Databases / Storage", "数据库 / 存储 / 搜索", /\b(database|postgresql|mysql|redis|sqlite|mongodb|elasticsearch|storage|数据库)\b/i],
  ["Data / Analytics", "数据工程 / 分析 / 可视化", /\b(data-engineering|data-science|analytics|visualization|pandas|numpy|spark|数据分析|数据工程)\b/i],
  ["Cloud / DevOps", "云原生 / DevOps / 运维", /\b(devops|kubernetes|docker|cloud-native|terraform|ansible|ci.cd|observability|云原生|运维)\b/i],
  ["Security", "网络安全 / 密码学", /\b(security|cybersecurity|vulnerability|cve-|exploit|pentest|cryptography|encryption|firewall|安全|密码学)\b/i],
  ["Testing / Quality", "测试 / 质量工程", /\b(testing|test-automation|quality-assurance|pytest|unit-test|benchmark|测试|质量工程)\b/i],
  ["Developer Tools", "开发工具 / CLI / IDE", /\b(cli|developer tools|devtools|terminal|editor|ide|workflow|automation|productivity|git|vscode|codegen|toolchain|开发工具|自动化)\b/i],
  ["Operating Systems", "操作系统 / 内核", /\b(linux|operating system|osdev|kernel|unix|bootloader|操作系统|内核)\b/i],
  ["Game / Graphics", "游戏开发 / 3D / 图形学", /\b(game|gamedev|graphics|3d|rendering|shader|unity|unreal|godot|sprite|图形学|游戏开发)\b/i],
  ["Design / Media", "设计 / 多媒体 / 创作", /\b(design-tools|animation|video|creative-tools|image|audio|music|design|动画|多媒体)\b/i],
  ["Blockchain / Web3", "区块链 / Web3", /\b(blockchain|web3|ethereum|solidity|crypto-wallet|区块链)\b/i],
  ["Learning / Tutorials", "学习资源 / 教程 / 课程", /\b(education|tutorial|course|curriculum|textbook|beginner|awesome-list|knowledge|study|learning-resources|教育|教程|学习资源)\b/i]
];
const displayNames = Object.fromEntries(categoryRules.map(([id, label]) => [id, label]));

let repositories = [];
let selectedCategory = "全部";
let selectedLanguage = "全部";
const normalize = value => String(value || "").toLowerCase();
function categoriesFor(repo) {
  const haystack = [repo.name, repo.description, repo.language, ...(repo.topics || [])].join(" ");
  const matched = categoryRules.filter(([id, , rule]) => rule.test(haystack)).map(([id]) => id);
  const supplied = Array.isArray(repo.categories) ? repo.categories : [];
  const combined = [...new Set([...supplied, ...matched])];
  return combined.length ? combined : ["其他项目"];
}
function make(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function renderFilters() {
  const all = ["全部", ...categoryRules.map(([id]) => id), "其他项目"];
  const counts = new Map(all.map(name => [name, 0]));
  repositories.forEach(repo => categoriesFor(repo).forEach(name => counts.set(name, (counts.get(name) || 0) + 1)));
  const holder = document.getElementById("categoryFilters");
  holder.replaceChildren();
  all.forEach(name => {
    const button = make("button", "chip" + (name === selectedCategory ? " active" : ""), name === "全部" ? "全部领域" : (displayNames[name] || name));
    button.type = "button"; button.dataset.category = name;
    button.setAttribute("aria-pressed", String(name === selectedCategory));
    button.title = name === "全部" ? "显示所有仓库" : "该领域约 " + (counts.get(name) || 0) + " 个项目";
    if (name !== "全部") button.textContent = (displayNames[name] || name) + " · " + (counts.get(name) || 0);
    button.addEventListener("click", () => { selectedCategory = name; renderFilters(); renderRepos(); });
    holder.append(button);
  });
  const languages = [...new Set(repositories.map(repo => repo.language || "未注明"))].sort((a,b) => a.localeCompare(b));
  const select = document.getElementById("languageFilter");
  const previous = selectedLanguage;
  select.replaceChildren(new Option("全部语言", "全部"), ...languages.map(lang => new Option(lang, lang)));
  select.value = languages.includes(previous) || previous === "全部" ? previous : "全部";
  selectedLanguage = select.value;
}
function renderRepos() {
  const query = normalize(document.getElementById("searchInput").value.trim());
  const filtered = repositories.filter(repo => {
    const categories = categoriesFor(repo);
    const matchesCategory = selectedCategory === "全部" || categories.includes(selectedCategory);
    const matchesLanguage = selectedLanguage === "全部" || (repo.language || "未注明") === selectedLanguage;
    const text = normalize([repo.name, repo.description, repo.language, ...(repo.topics || []), ...categories].join(" "));
    return matchesCategory && matchesLanguage && (!query || text.includes(query));
  });
  const grid = document.getElementById("repoGrid");
  grid.replaceChildren();
  if (!filtered.length) {
    const empty = make("div", "empty", "没有找到符合条件的仓库。试试切换领域、语言或缩短关键词。");
    grid.append(empty);
  }
  filtered.forEach(repo => {
    const index = repositories.indexOf(repo) + 1;
    const card = make("article", "repo-card");
    const top = make("div", "repo-top");
    top.append(make("span", "rank", "#" + String(index).padStart(2, "0")), make("span", "language", repo.language || "未注明"));
    const titleRow = make("div", "repo-title-row");
    const avatar = document.createElement("img"); avatar.src = repo.owner_avatar || ""; avatar.alt = ""; avatar.loading = "lazy";
    const heading = make("h2"); const link = make("a", "", repo.name);
    link.href = repo.url; link.target = "_blank"; link.rel = "noopener noreferrer"; heading.append(link); titleRow.append(avatar, heading);
    const description = make("p", "description", repo.description || "暂无项目介绍");
    const topics = make("div", "topics");
    (repo.topics || []).forEach(topic => topics.append(make("span", "topic", topic)));
    const categoryTags = make("div", "categories");
    categoriesFor(repo).forEach(category => categoryTags.append(make("span", "category-tag", displayNames[category] || category)));
    const metrics = make("div", "metrics");
    metrics.append(make("span", "", "★ " + Number(repo.stars || 0).toLocaleString()), make("span", "", "⑂ " + Number(repo.forks || 0).toLocaleString()), make("span", "", "◎ " + Number(repo.issues || 0).toLocaleString() + " issues"));
    card.append(top, titleRow, description, topics, categoryTags, metrics); grid.append(card);
  });
  document.getElementById("resultCount").textContent = "显示 " + filtered.length + " / " + repositories.length + " 个仓库";
}
document.getElementById("searchInput").addEventListener("input", renderRepos);
document.getElementById("languageFilter").addEventListener("change", event => { selectedLanguage = event.target.value; renderRepos(); });
fetch("./static/data/github-trending.json", {cache:"no-store"})
  .then(response => { if (!response.ok) throw new Error("HTTP " + response.status); return response.json(); })
  .then(data => {
    repositories = Array.isArray(data.repositories) ? data.repositories : [];
    document.getElementById("totalStat").textContent = "收录 " + repositories.length + " 个仓库";
    document.getElementById("updatedStat").textContent = data.generated_at ? "更新时间：" + data.generated_at + " UTC" : "等待首次更新";
    renderFilters(); renderRepos();
  })
  .catch(() => { document.getElementById("repoGrid").replaceChildren(make("div","empty","暂时无法读取数据，请稍后刷新，或在 GitHub Actions 中手动运行 Daily GitHub Trending。")); });
</script></body></html>
