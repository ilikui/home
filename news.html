<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="通过 RSS 汇聚科技、国际、人工智能与开源资讯的个人新闻热点阅读页。">
<meta name="theme-color" content="#f4f6fa"><title>新闻热点 · LiKui</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--panel:#fff;--soft:#f8f9fc;--line:#e5e9f1;--text:#1c2434;--muted:#788399;--accent:#5d63e8;--accent-bg:#eeefff;--shadow:0 14px 42px #25365b0d}
html[data-theme=dark]{color-scheme:dark;--bg:#11141b;--panel:#191e28;--soft:#202633;--line:#2a3241;--text:#edf0f8;--muted:#a0a8ba;--accent:#a4a7ff;--accent-bg:#2b2c48;--shadow:0 14px 42px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 Manrope,"Noto Sans SC",system-ui,-apple-system,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 36px));margin:auto}
header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.03em}.header-actions{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:999px;color:var(--muted);font-size:13px}
.hero{padding:54px 0 30px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.16em;color:var(--accent);font-weight:800}h1{font-size:clamp(38px,6vw,66px);letter-spacing:-.06em;line-height:1.08;margin:13px 0}.lead{max-width:720px;color:var(--muted);margin:0}.hero-mark{width:112px;height:112px;border-radius:30px;background:linear-gradient(135deg,var(--accent-bg),var(--panel));border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font-size:42px}
.stats{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0 28px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 12px;color:var(--muted);font-size:12px}
.toolbar{position:sticky;top:10px;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:22px}.categories{display:flex;gap:7px;flex-wrap:wrap}.chip{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;font-size:12px}.chip.active{background:var(--accent-bg);color:var(--accent);border-color:transparent;font-weight:800}.search-row{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;margin-top:13px}.search-row input,.search-row select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:11px;font:inherit;outline:none}.search-row input:focus,.search-row select:focus{border-color:var(--accent)}
.section-line{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:12px;margin:20px 2px 12px}.news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;padding-bottom:60px}.news-card{display:flex;flex-direction:column;min-width:0;padding:20px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}.news-card:hover{transform:translateY(-3px);border-color:var(--accent)}.card-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px}.category{color:var(--accent);font-weight:800}.news-card h2{font-size:17px;line-height:1.5;letter-spacing:-.02em;margin:17px 0 10px;overflow-wrap:anywhere}.summary{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 22px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.card-foot{margin-top:auto;padding-top:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}.read-link{color:var(--accent);font-weight:800}.empty{grid-column:1/-1;text-align:center;padding:55px 18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:23px 0 35px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
@media(max-width:900px){.news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.hero{grid-template-columns:1fr;padding-top:36px}.hero-mark{display:none}.news-grid,.search-row{grid-template-columns:1fr}.toolbar{position:static}header{height:66px}}
</style></head>
<body><div class="wrap">
<header><a class="brand" href="/">LiKui / NEWS RADAR</a><div class="header-actions"><button class="pill" id="themeToggle" type="button">切换主题</button><a class="pill" href="/">← 返回主页</a></div></header>
<section class="hero"><div><div class="eyebrow">RSS · PERSONAL NEWS RADAR</div><h1>新闻热点<span style="color:var(--accent)">.</span></h1><p class="lead">用 RSS 汇聚分散的信息源，把科技、人工智能、国际新闻与开源动态整理成一个清爽、可搜索的阅读入口。点击标题可阅读原文。</p></div><div class="hero-mark" aria-hidden="true">◉</div></section>
<div class="stats"><span class="stat" id="totalStat">正在读取新闻…</span><span class="stat" id="sourceStat">RSS 多源聚合</span><span class="stat" id="updatedStat">更新时间读取中</span></div>
<section class="toolbar" aria-label="新闻筛选"><div class="categories" id="categories"><button class="chip active" data-category="全部">全部热点</button></div><div class="search-row"><input id="search" type="search" placeholder="搜索标题、摘要或来源…" aria-label="搜索新闻"><select id="sort"><option value="newest">最新发布优先</option><option value="source">按来源排序</option></select></div></section>
<div class="section-line"><span id="resultCount">准备加载新闻</span><span>内容来自公开 RSS，版权归原发布方所有</span></div>
<main class="news-grid" id="newsGrid"><div class="empty">正在加载 RSS 新闻…</div></main>
<footer><span>LiKui Personal Hub · Build, Learn, Share.</span><span>RSS 自动聚合 · 请以原文为准</span></footer>
</div>
<script>
(() => {
const grid=document.getElementById('newsGrid'), categories=document.getElementById('categories'), search=document.getElementById('search'), sort=document.getElementById('sort');
let items=[],active='全部';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(!s)return '时间未提供';const d=new Date(s);return Number.isNaN(d.getTime())?'时间未提供':new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)};
function render(){const q=search.value.trim().toLowerCase();let list=items.filter(x=>(active==='全部'||x.category===active)&&[x.title,x.summary,x.source].join(' ').toLowerCase().includes(q));list.sort((a,b)=>sort.value==='source'?a.source.localeCompare(b.source):new Date(b.published||0)-new Date(a.published||0));document.getElementById('resultCount').textContent='显示 '+list.length+' 条新闻';grid.innerHTML=list.length?list.map(x=>'<article class="news-card"><div class="card-meta"><span class="category">'+esc(x.category||'资讯')+'</span><time>'+esc(fmt(x.published))+'</time></div><h2><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a></h2><p class="summary">'+esc(x.summary||'打开原文查看详细内容。')+'</p><div class="card-foot"><span>'+esc(x.source||'RSS 来源')+'</span><a class="read-link" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a></div></article>').join(''):'<div class="empty">没有找到符合条件的新闻，试试其他关键词或分类。</div>'}
function setCategory(value){active=value;categories.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.category===value));render()}
search.addEventListener('input',render);sort.addEventListener('change',render);
document.getElementById('themeToggle').addEventListener('click',()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark'});
fetch('/static/data/news.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{items=Array.isArray(data.items)?data.items:[];const cats=['全部',...new Set(items.map(x=>x.category).filter(Boolean))];categories.innerHTML=cats.map(c=>'<button class="chip'+(c==='全部'?' active':'')+'" data-category="'+esc(c)+'">'+esc(c==='全部'?'全部热点':c)+'</button>').join('');categories.addEventListener('click',e=>{const b=e.target.closest('button[data-category]');if(b)setCategory(b.dataset.category)});document.getElementById('totalStat').textContent=items.length+' 条新闻';document.getElementById('sourceStat').textContent=(data.source_count??'多')+' 个 RSS 来源';document.getElementById('updatedStat').textContent='更新于 '+fmt(data.updated_at);render()}).catch(err=>{console.error(err);grid.innerHTML='<div class="empty">新闻数据暂时无法加载。请稍后刷新，或检查 GitHub Actions 的 RSS 更新任务。</div>';document.getElementById('totalStat').textContent='数据暂不可用'});
})();
</script></body></html>
